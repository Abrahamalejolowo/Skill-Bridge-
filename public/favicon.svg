<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect width="200" height="200" fill="#FAFAF8" rx="40"/>
  
  <!-- Bridge structure -->
  <g>
    <!-- Left pillar -->
    <rect x="35" y="110" width="12" height="50" fill="#4B7355" rx="2"/>
    
    <!-- Right pillar -->
    <rect x="153" y="110" width="12" height="50" fill="#4B7355" rx="2"/>
    
    <!-- Bridge deck -->
    <rect x="35" y="105" width="130" height="12" fill="#4B7355" rx="2"/>
    
    <!-- Bridge supports -->
    <line x1="45" y1="105" x2="40" y2="90" stroke="#4B7355" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="105" x2="100" y2="85" stroke="#4B7355" stroke-width="3" stroke-linecap="round"/>
    <line x1="155" y1="105" x2="160" y2="90" stroke="#4B7355" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Upward arrow (growth/opportunity) -->
  <g>
    <!-- Arrow shaft -->
    <rect x="90" y="35" width="20" height="50" fill="#E29D38" rx="3"/>
    
    <!-- Arrow head -->
    <polygon points="100,15 115,35 85,35" fill="#E29D38"/>
  </g>
  
  <!-- Small accent circle -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="#E29D38" stroke-width="2" opacity="0.3"/>
</svg>
